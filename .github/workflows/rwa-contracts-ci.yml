name: rwa-contracts-ci
on:
  push:
    paths:
      - "rwa-contracts/**"
      - ".github/workflows/rwa-contracts-ci.yml"
  pull_request:
    paths:
      - "rwa-contracts/**"
      - ".github/workflows/rwa-contracts-ci.yml"
jobs:
  standalone-rwa-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Aiken
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/aiken-lang/aiken/releases/download/v1.1.22/aiken-installer.sh | sh
          echo "$HOME/.aiken/bin" >> "$GITHUB_PATH"
      - name: Check standalone stock escrow
        run: cd rwa-contracts && "$HOME/.aiken/bin/aiken" check --max-success=5000
      - name: Build standalone blueprint
        run: cd rwa-contracts && "$HOME/.aiken/bin/aiken" build
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-symbiotic-stock-pair-blueprint
          path: rwa-contracts/plutus.json
          if-no-files-found: error
