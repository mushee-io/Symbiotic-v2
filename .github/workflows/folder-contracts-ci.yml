name: folder-contracts-ci
on:
  push:
    paths:
      - "folder-contracts/**"
      - ".github/workflows/folder-contracts-ci.yml"
  pull_request:
    paths:
      - "folder-contracts/**"
      - ".github/workflows/folder-contracts-ci.yml"
permissions:
  contents: read
jobs:
  test-and-compile-folder-escrows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Aiken v1.1.22
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/aiken-lang/aiken/releases/download/v1.1.22/aiken-installer.sh | sh
          echo "$HOME/.aiken/bin" >> "$GITHUB_PATH"
      - name: Run Longbow and Twofold Aiken tests
        run: |
          cd folder-contracts
          script -q -e -c "$HOME/.aiken/bin/aiken check --max-success=5000" /dev/null
      - name: Build isolated Plutus V3 blueprint
        run: cd folder-contracts && "$HOME/.aiken/bin/aiken" build
      - name: Upload compiled Preprod-only test blueprint
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: symbiotic-folder-experimental-blueprint
          path: folder-contracts/plutus.json
          if-no-files-found: error
